name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/UniversalBatteryOverlay/UniversalBatteryOverlay.csproj --configfile NuGet.config -r win-x64

      - name: Build
        run: dotnet build src/UniversalBatteryOverlay/UniversalBatteryOverlay.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/UniversalBatteryOverlay/UniversalBatteryOverlay.csproj -c Release -r win-x64 --self-contained false --no-restore /p:UseAppHost=true /p:PublishSingleFile=false

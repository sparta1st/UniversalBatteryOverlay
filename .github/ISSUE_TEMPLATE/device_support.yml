name: Device support request
description: Ask for support for a new wireless device.
title: "Device support: "
labels: [device-support]
body:
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: Brand + exact model
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - 2.4 GHz dongle
        - Bluetooth
        - USB cable
        - Unknown
    validations:
      required: true
  - type: textarea
    id: windows-detection
    attributes:
      label: How Windows detects it
      description: Include Device Manager name, VID/PID if known, or screenshots.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention whether the official app shows battery percentage.
    validations:
      required: false
